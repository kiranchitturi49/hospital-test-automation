stages:
  - build
  - test
  - deploy

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip

build:
  stage: build
  image: python:3.9
  script:
    - python --version
    - pip install -r requirements.txt
  only:
    - main
    - merge_requests

test:
  stage: test
  image: python:3.9
  script:
    - pip install -r requirements.txt
    - mkdir -p html-report
    - pytest tests/ --junitxml=junit-report.xml --html=html-report/index.html --self-contained-html
  artifacts:
    reports:
      junit: junit-report.xml
    paths:
      - html-report/
    expire_in: 1 week
  only:
    - main
    - merge_requests

deploy:
  stage: deploy
  script:
    - echo "Deploy stage - placeholder for future deployment"
  only:
    - main
  when: manual</content>
<parameter name="filePath">d:\hospital-test-automation\.gitlab-ci.yml