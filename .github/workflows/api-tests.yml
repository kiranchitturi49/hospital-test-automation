name: "API Tests"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production]
  schedule:
    # Run every day at 6:00 AM IST (00:30 UTC)
    - cron: "30 0 * * *"

env:
  APP_BASE_URL: ${{ vars.APP_BASE_URL || 'http://65.0.98.124:8000' }}

jobs:
  api-tests:
    name: "API Tests — ${{ inputs.environment || 'production' }}"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run API test suite
        run: |
          pytest tests/ -v \
            --tb=short \
            --junitxml=test-results.xml \
            --html=test-report.html \
            --self-contained-html
        env:
          APP_BASE_URL:    ${{ env.APP_BASE_URL }}
          TEST_ADMIN_USER: ${{ secrets.TEST_ADMIN_USER }}
          TEST_ADMIN_PASS: ${{ secrets.TEST_ADMIN_PASS }}
          TEST_DOCTOR_USER: ${{ secrets.TEST_DOCTOR_USER }}
          TEST_DOCTOR_PASS: ${{ secrets.TEST_DOCTOR_PASS }}

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report-${{ github.run_id }}
          path: |
            test-results.xml
            test-report.html
          retention-days: 30

      - name: Post summary
        if: always()
        run: |
          {
            echo "## API Test Results"
            echo "- **URL**: \`${{ env.APP_BASE_URL }}\`"
            echo "- **Run**: \`${{ github.run_id }}\`"
          } >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: "Notify on Failure"
    needs: api-tests
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Open GitHub Issue on test failure
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `🔴 API tests failed — ${new Date().toISOString().slice(0,10)}`,
              body:  `**Run**: [#${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n**URL**: ${{ env.APP_BASE_URL }}`,
              labels: ['bug', 'test-failure']
            });
